<div class="relative mx-auto min-h-screen w-96 overflow-hidden rounded-[30px] bg-white">

  <!-- Contenu de la page -->
  <main class="min-h-screen pb-24">
    <router-outlet></router-outlet>
  </main>

  <!-- Navigation commune de l'agent -->
  <nav
    class="absolute bottom-0 left-0 z-50 flex w-full items-end justify-between
           rounded-t-xl bg-white px-7 pb-4 pt-2
           shadow-[0_-2px_12px_rgba(0,0,0,0.25)]"
  >

    <!-- Tâches -->
<a
  routerLink="/agent"
  routerLinkActive="bg-teal-950 text-green-300"
  [routerLinkActiveOptions]="{ exact: true }"
  class="flex flex-col items-center justify-center rounded-full px-6 py-2"
>
  <svg
    class="h-5 w-5"
    viewBox="0 0 24 24"
    fill="currentColor"
    aria-hidden="true"
  >
    <rect x="4" y="4" width="6" height="6" rx="0.5" />
    <rect x="14" y="4" width="6" height="6" rx="0.5" />
    <rect x="4" y="14" width="6" height="6" rx="0.5" />
    <rect x="14" y="14" width="6" height="6" rx="0.5" />
  </svg>

  <span class="text-xs font-semibold leading-5">
    Tâches
  </span>
</a>

    <!-- Interventions -->
<a
  routerLink="/agent/interventions"
  routerLinkActive="bg-teal-950 text-green-300"
  class="flex flex-col items-center justify-center rounded-full px-4 py-2"
>
  <svg
    class="h-5 w-5"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="m3 5.5 6-2.5 6 2.5L21 3v15.5L15 21l-6-2.5-6 2.5V5.5Z" />
    <path d="M9 3v15.5" />
    <path d="M15 5.5V21" />
  </svg>

  <span class="text-xs font-semibold leading-5">
    Interventions
  </span>
</a>

    <!-- Profil -->
<a
  routerLink="/agent/profil"
  routerLinkActive="bg-teal-950 text-green-300"
  class="flex flex-col items-center justify-center rounded-full px-4 py-2"
>
  <svg
    class="h-5 w-5"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="12" cy="7" r="3" />
    <path d="M5 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1" />
  </svg>

  <span class="text-xs font-semibold leading-5">
    Profil
  </span>
</a>

  </nav>

</div>
