<div class="w-96 max-w-96 min-w-96 min-h-[874px] pb-24 bg-white rounded-[30px] flex flex-col items-center gap-10">

  <!-- Header -->
  <header class="w-full px-6 pt-7 pb-6 flex justify-between items-center">

    <!-- Bouton retour -->
    <button class="size-10 bg-zinc-100 rounded-full flex items-center justify-center">
      <svg class="size-5" viewBox="0 0 20 20" fill="none">
        <path d="M8.33 4.17L4.17 10L8.33 15.83" stroke="currentColor" stroke-width="1.67"/>
        <path d="M4.17 10H15.83" stroke="currentColor" stroke-width="1.67"/>
      </svg>
    </button>

    <!-- Logo -->
    <img
      src="./images/logo.png" alt="Logo Andë Sétal"
      class="w-36 h-8 object-contain"
    />

    <!-- Espace pour équilibrer le header -->
    <div class="size-10"></div>

  </header>


  <!-- Progression -->
  <div class="w-full px-0 pt-2 flex gap-2">
    <div class="flex-1 h-1 bg-teal-900 rounded-full"></div>
    <div class="flex-1 h-1 bg-stone-200 rounded-full"></div>
  </div>


  <!-- Titre et description -->
  <section class="w-80 pt-3.5 text-center">

    <h1 class="text-teal-950 text-2xl font-bold leading-8">
      Vérification de l'email
    </h1>

    <p class="mt-1.5 text-slate-400 text-sm leading-6">
      Entrez le code envoyé par EMAIL pour sécuriser votre compte.
    </p>

  </section>


  <!-- Email destinataire -->
  <div class="w-full flex justify-center">

    <div class="px-4 py-3 bg-white rounded-full border border-teal-950 flex items-center gap-2">

      <svg class="size-4" viewBox="0 0 16 16" fill="none">
        <rect
          x="1.33"
          y="2"
          width="13.34"
          height="12"
          rx="1"
          stroke="currentColor"
          stroke-width="1.33"
        />
        <path
          d="M4.67 7.33H11.33M4.67 10H8.67M4.67 4.67H11.33"
          stroke="currentColor"
          stroke-width="1.33"
        />
      </svg>

      <span class="text-teal-950 text-sm font-medium leading-5">
        Code envoyé au fass.....@gmail.com
      </span>

    </div>

  </div>


  <!-- Code de vérification -->
  <section class="w-96 p-6 bg-white rounded-2xl shadow-sm">

    <div class="flex flex-col gap-4">

      <!-- Champs OTP -->
    <div class="flex justify-between">

    @for (case of codeVerification(); track $index) {
        <input
        #champOtp
        type="text"
        inputmode="numeric"
        maxlength="1"
        [value]="case"
        (input)="saisirChiffre($event, $index)"
        (keydown)="gererTouche($event, $index)"
        (paste)="collerCode($event, $index)"
        class="w-11 h-14 rounded-xl border border-stone-300
                text-center text-lg font-semibold text-teal-950
                outline-none
                focus:border-2
                focus:border-slate-500
                focus:ring-4
                focus:ring-teal-700/15"
        [attr.aria-label]="'Chiffre ' + ($index + 1) + ' du code'"
        />
    }

    </div>


      <!-- Compteur -->
      <div class="pt-2 flex justify-center items-center gap-2">

        <svg class="size-4" viewBox="0 0 16 16" fill="none">
          <path
            d="M8 1.33V3.33M8 12.67V14.67M1.33 8H3.33M12.67 8H14.67"
            stroke="currentColor"
            stroke-width="1.33"
          />
          <circle
            cx="8"
            cy="8"
            r="5.33"
            stroke="currentColor"
            stroke-width="1.33"
          />
        </svg>

        <span class="text-neutral-500 text-sm leading-5">
          Renvoyer le code dans
        </span>

        <span class="text-teal-950 text-sm font-bold leading-5">
          00:42
        </span>

      </div>

    </div>

  </section>


  <!-- Actions -->
  <section class="w-96 pt-2 px-6">

    <div class="flex flex-col gap-4">

      <!-- Bouton principal -->
      <button type="button" (click)="verifierCode()" class="w-full h-12 px-3 bg-teal-950 rounded-2xl flex justify-center items-center gap-3">

        <span class="text-white text-base font-bold leading-6">
          Vérifier mon email
        </span>

        <svg class="size-5" viewBox="0 0 20 20" fill="none">
          <path
            d="M4.17 10H15.83"
            stroke="white"
            stroke-width="1.67"
          />
          <path
            d="M10 4.17L15.83 10L10 15.83"
            stroke="white"
            stroke-width="1.67"
          />
        </svg>

      </button>


      <!-- Modifier l'email -->
      <button class="text-slate-500 text-sm font-semibold leading-5 text-center">
        Modifier l'email
      </button>

    </div>

  </section>

</div>
