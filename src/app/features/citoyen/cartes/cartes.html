<div class="relative w-full h-[calc(100vh-80px)] bg-slate-200 overflow-hidden font-sans">

  <!-- Carte Leaflet plein écran -->
  <div id="map-container" class="absolute inset-0 z-0 w-full h-full"></div>

  <!-- Overlay d'éléments flottants supérieurs -->
  <div class="absolute top-4 left-0 right-0 z-10 px-4 flex flex-col gap-3 max-w-md mx-auto">

    <!-- Barre de recherche supérieure -->
    <div class="relative w-full bg-white/95 backdrop-blur-md rounded-full shadow-lg border border-slate-100 p-1.5 flex items-center gap-2">
      <div class="pl-3 text-slate-400">
        <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (input)="applyFilters()"
        placeholder="Rechercher un quartier..."
        class="w-full bg-transparent text-sm text-slate-800 focus:outline-none placeholder:text-slate-400 font-medium"
      />
      <button class="pr-2 text-slate-500 hover:text-teal-950 transition-colors" title="Filtres avancés">
        <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
        </svg>
      </button>
    </div>

    <!-- Filtres sous forme de pilules défilantes -->
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
      
      <!-- Tous -->
      <button
        (click)="setFilter('tous')"
        [class]="activeFilter === 'tous'
          ? 'bg-teal-950 text-white border-teal-950 shadow-md scale-105'
          : 'bg-white/90 text-slate-700 border-slate-200 hover:bg-white'"
        class="flex items-center gap-1.5 px-3.5 py-2 rounded-full border text-xs font-semibold shrink-0 backdrop-blur-md transition-all active:scale-95"
      >
        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        Tous
      </button>

      <!-- Déchets -->
      <button
        (click)="setFilter('dechets')"
        [class]="activeFilter === 'dechets'
          ? 'bg-teal-950 text-white border-teal-950 shadow-md scale-105'
          : 'bg-white/90 text-slate-700 border-slate-200 hover:bg-white'"
        class="flex items-center gap-1.5 px-3.5 py-2 rounded-full border text-xs font-semibold shrink-0 backdrop-blur-md transition-all active:scale-95"
      >
        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
        Déchets
      </button>

      <!-- Canaux -->
      <button
        (click)="setFilter('canaux')"
        [class]="activeFilter === 'canaux'
          ? 'bg-teal-950 text-white border-teal-950 shadow-md scale-105'
          : 'bg-white/90 text-slate-700 border-slate-200 hover:bg-white'"
        class="flex items-center gap-1.5 px-3.5 py-2 rounded-full border text-xs font-semibold shrink-0 backdrop-blur-md transition-all active:scale-95"
      >
        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 01-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 011-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 011.52 0C14.5 3.8 17 5 19 5a1 1 0 011 1v7z"/>
        </svg>
        Canaux
      </button>

      <!-- Voirie -->
      <button
        (click)="setFilter('voirie')"
        [class]="activeFilter === 'voirie'
          ? 'bg-teal-950 text-white border-teal-950 shadow-md scale-105'
          : 'bg-white/90 text-slate-700 border-slate-200 hover:bg-white'"
        class="flex items-center gap-1.5 px-3.5 py-2 rounded-full border text-xs font-semibold shrink-0 backdrop-blur-md transition-all active:scale-95"
      >
        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
        </svg>
        Voirie
      </button>

    </div>

  </div>

  <!-- Boutons de contrôle de la carte (droite) -->
  <div class="absolute right-4 bottom-32 z-10 flex flex-col gap-2.5">
    <!-- Repositionnement GPS -->
    <button
      (click)="recenterMap()"
      class="size-11 rounded-full bg-white/95 backdrop-blur-md shadow-lg border border-slate-100 flex items-center justify-center text-slate-700 hover:text-teal-950 active:scale-90 transition-transform"
      title="Ma position"
    >
      <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
    </button>

    <!-- Boussole -->
    <button
      (click)="recenterMap()"
      class="size-11 rounded-full bg-white/95 backdrop-blur-md shadow-lg border border-slate-100 flex items-center justify-center text-amber-600 active:scale-90 transition-transform"
      title="Boussole / Nord"
    >
      <svg class="size-5 rotate-45" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <polygon stroke-linecap="round" stroke-linejoin="round" stroke-width="2" points="12,2 19,21 12,17 5,21"/>
      </svg>
    </button>
  </div>

  <!-- Bottom Sheet / Carte d'Aperçu de l'Incident Sélectionné -->
  <div
    *ngIf="selectedIncident"
    class="absolute bottom-4 left-4 right-4 z-20 max-w-md mx-auto bg-white/95 backdrop-blur-md rounded-3xl p-4 shadow-2xl border border-slate-100/80 animate-slide-up"
  >
    <!-- Poignée de glissement -->
    <div class="w-10 h-1 bg-slate-300 rounded-full mx-auto mb-3"></div>

    <div class="flex items-center gap-3.5">
      <!-- Vignette Photo -->
      <div class="size-16 rounded-2xl overflow-hidden bg-slate-100 shrink-0 border border-slate-200/60 shadow-sm">
        @if (selectedIncident.photoUrl) {
        <img
          [src]="selectedIncident.photoUrl"
          alt="Aperçu incident"
          class="w-full h-full object-cover"
        />
        }
      </div>

      <!-- Informations -->
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5 mb-0.5">
          <svg class="size-4 text-red-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 1-4 4-6 1.5 2 3.5 3 4.5 6 1 3 0 5-1.843 8.657z"/>
          </svg>
          <h3 class="text-sm font-bold text-slate-900 truncate">
            {{ selectedIncident.titre }}
          </h3>
        </div>

        <p class="text-xs text-slate-500 font-medium truncate mb-1">
          {{ selectedIncident.adresse }} &bull; il y a 2h
        </p>

        <!-- Statut / Urgence -->
        <div class="flex items-center gap-1.5 text-xs font-bold text-red-600">
          <span class="size-2 rounded-full bg-red-500 animate-pulse"></span>
          <span class="capitalize">{{ selectedIncident.urgence }}</span>
        </div>
      </div>

      <!-- Bouton Détail > -->
      <button
        (click)="viewDetail(selectedIncident)"
        class="bg-teal-950 hover:bg-teal-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-md active:scale-95 transition-transform shrink-0 flex items-center gap-1"
      >
        Détail
        <svg class="size-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
        </svg>
      </button>

    </div>
  </div>

</div>
