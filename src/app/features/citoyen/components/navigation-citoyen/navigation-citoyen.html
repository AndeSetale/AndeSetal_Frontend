<nav class="fixed bottom-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-md border-t border-gray-100 px-4 py-2 shadow-lg">
  <div class="max-w-md mx-auto flex items-center justify-between relative">
    
    <!-- Accueil -->
    <a
      routerLink="/mobile"
      routerLinkActive="text-teal-900 font-semibold"
      [routerLinkActiveOptions]="{ exact: true }"
      #rlaAccueil="routerLinkActive"
      class="flex flex-col items-center gap-1 text-gray-500 hover:text-teal-800 transition-colors w-14"
    >
      <svg class="size-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      <span class="text-[10px] tracking-tight">Accueil</span>
      <span *ngIf="rlaAccueil.isActive" class="size-1.5 rounded-full bg-teal-900"></span>
    </a>

    <!-- Carte -->
    <a
      routerLink="/mobile/carte"
      routerLinkActive="text-teal-900 font-semibold"
      #rlaCarte="routerLinkActive"
      class="flex flex-col items-center gap-1 text-gray-500 hover:text-teal-800 transition-colors w-14"
    >
      <svg class="size-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
      </svg>
      <span class="text-[10px] tracking-tight">Carte</span>
      <span *ngIf="rlaCarte.isActive" class="size-1.5 rounded-full bg-teal-900"></span>
    </a>

    <!-- Bouton central + (Scan) -->
    <div class="relative -top-5 flex justify-center">
      <a
        routerLink="/mobile/scan"
        class="size-14 rounded-full bg-teal-950 text-white flex items-center justify-center shadow-xl hover:bg-teal-900 active:scale-95 transition-all border-4 border-white"
        title="Signaler un incident"
      >
        <svg class="size-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
        </svg>
      </a>
    </div>

    <!-- Signals (Incidents) -->
    <a
      routerLink="/mobile/enregistrement"
      routerLinkActive="text-teal-900 font-semibold"
      #rlaSignals="routerLinkActive"
      class="flex flex-col items-center gap-1 text-gray-500 hover:text-teal-800 transition-colors w-14"
    >
      <svg class="size-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
      </svg>
      <span class="text-[10px] tracking-tight">Signals</span>
      <span *ngIf="rlaSignals.isActive" class="size-1.5 rounded-full bg-teal-900"></span>
    </a>

    <!-- Profil -->
    <a
      routerLink="/connexion"
      routerLinkActive="text-teal-900 font-semibold"
      class="flex flex-col items-center gap-1 text-gray-500 hover:text-teal-800 transition-colors w-14"
    >
      <svg class="size-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
      <span class="text-[10px] tracking-tight">Profil</span>
    </a>

  </div>
</nav>
