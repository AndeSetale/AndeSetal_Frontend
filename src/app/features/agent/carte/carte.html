<div
  class="relative mx-auto h-screen w-full max-w-[384px] overflow-hidden bg-green-50"
>
  <!-- =========================================================
       CARTE
  ========================================================== -->

  <section class="relative h-full w-full overflow-hidden">

    <!-- =======================================================
         LEAFLET
    ======================================================== -->

    <div
      id="map"
      class="absolute inset-0 z-0 h-full w-full bg-red-200"
      aria-label="Carte des signalements"
    ></div>


    <!-- =======================================================
         HEADER
         Le header est fourni par app-header-agent.
         Pas de doublon titre/flèche ici.
    ======================================================== -->

    <app-header-agent
      titre="Carte"
      class="absolute inset-x-0 top-0 z-40 block"
    ></app-header-agent>


    <!-- =======================================================
         FILTRES
    ======================================================== -->

    <nav
      class="absolute inset-x-0 top-20 z-30 overflow-x-auto px-3 pb-2 pt-3"
      aria-label="Filtres de carte"
    >
      <div class="flex w-max gap-2">

        <!-- Tous -->
        <button
          type="button"
          aria-pressed="true"
          class="flex h-9 shrink-0 items-center gap-1 rounded-full bg-teal-950 px-3 text-xs font-medium leading-4 text-green-50 shadow-sm"
        >
          <svg
            class="size-4"
            viewBox="0 0 16 16"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M2 2h4v4H2V2Zm8 0h4v4h-4V2ZM2 10h4v4H2v-4Zm8 0h4v4h-4v-4Z"
              stroke="currentColor"
              stroke-width="1.33"
              stroke-linejoin="round"
            />
          </svg>

          <span>Tous</span>
        </button>


        <!-- Déchets -->
        <button
          type="button"
          aria-pressed="false"
          class="flex h-9 shrink-0 items-center gap-1 rounded-full bg-white/90 px-3 text-xs font-medium leading-4 text-zinc-900 shadow-[0_1px_3px_rgba(0,0,0,0.1)] backdrop-blur-[10px]"
        >
          <svg
            class="size-4"
            viewBox="0 0 16 16"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M5 5h6m-5-2h4m-5 2 1 8h4l1-8"
              stroke="currentColor"
              stroke-width="1.33"
              stroke-linecap="round"
            />
          </svg>

          <span>Déchets</span>
        </button>


        <!-- Canaux -->
        <button
          type="button"
          aria-pressed="false"
          class="flex h-9 shrink-0 items-center gap-1 rounded-full bg-white/90 px-3 text-xs font-medium leading-4 text-zinc-900 shadow-[0_1px_3px_rgba(0,0,0,0.1)] backdrop-blur-[10px]"
        >
          <svg
            class="size-4"
            viewBox="0 0 16 16"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M2 4h12M2 8h12M2 12h12"
              stroke="currentColor"
              stroke-width="1.33"
              stroke-linecap="round"
            />
          </svg>

          <span>Canaux</span>
        </button>


        <!-- Voirie -->
        <button
          type="button"
          aria-pressed="false"
          class="flex h-9 shrink-0 items-center gap-1 rounded-full bg-white/90 px-3 text-xs font-medium leading-4 text-zinc-900 shadow-[0_1px_3px_rgba(0,0,0,0.1)] backdrop-blur-[10px]"
        >
          <svg
            class="size-4"
            viewBox="0 0 16 16"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M2 5.5h12M4.5 5.5V3m7 2.5V3M4.5 5.5l1.5 5m5.5-5-1.5 5M7 5.5v5"
              stroke="currentColor"
              stroke-width="1.33"
              stroke-linecap="round"
            />
          </svg>

          <span>Voirie</span>
        </button>


        <!-- Eau -->
        <button
          type="button"
          aria-pressed="false"
          class="flex h-9 shrink-0 items-center gap-1 rounded-full bg-white/90 px-3 text-xs font-medium leading-4 text-zinc-900 shadow-[0_1px_3px_rgba(0,0,0,0.1)] backdrop-blur-[10px]"
        >
          <svg
            class="size-4"
            viewBox="0 0 16 16"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M8 2s-4 4.3-4 7a4 4 0 0 0 8 0c0-2.7-4-7-4-7Z"
              stroke="currentColor"
              stroke-width="1.33"
              stroke-linejoin="round"
            />
          </svg>

          <span>Eau</span>
        </button>

      </div>
    </nav>


    <!-- =======================================================
         CONTRÔLES DE LA CARTE
    ======================================================== -->

    <div
      class="absolute bottom-[159px] right-3 z-20 flex flex-col gap-3"
    >

      <!-- Ma position -->
      <button
        type="button"
        class="flex size-12 items-center justify-center rounded-full bg-white text-stone-500 shadow-lg"
        aria-label="Ma position"
      >
        <svg
          class="size-5"
          viewBox="0 0 20 20"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M10 1.67v2.5m0 11.66v2.5M1.67 10h2.5m11.66 0h2.5"
            stroke="currentColor"
            stroke-width="1.67"
            stroke-linecap="round"
          />

          <circle
            cx="10"
            cy="10"
            r="5.83"
            stroke="currentColor"
            stroke-width="1.67"
          />

          <circle
            cx="10"
            cy="10"
            r="2.5"
            stroke="currentColor"
            stroke-width="1.67"
          />
        </svg>
      </button>


      <!-- Calques -->
      <button
        type="button"
        class="flex size-12 items-center justify-center rounded-full bg-white text-orange-600 shadow-lg"
        aria-label="Calques"
      >
        <svg
          class="size-5"
          viewBox="0 0 20 20"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="10"
            cy="10"
            r="8"
            stroke="currentColor"
            stroke-width="1.67"
          />
        </svg>
      </button>

    </div>


    <!-- =======================================================
         BOTTOM SHEET
    ======================================================== -->

    @if (selection()) {
    <footer
      class="absolute inset-x-0 bottom-0 z-40 w-full rounded-t-3xl bg-white/95 shadow-[0_-8px_30px_rgba(0,0,0,0.12)] backdrop-blur-lg"
    >

      <!-- Handle -->
      <div class="flex justify-center pt-2">
        <div class="h-1 w-10 rounded-full bg-zinc-200"></div>
      </div>


      <!-- Contenu -->
      <div class="flex flex-col gap-3 px-4 pb-4 pt-3">

        <article
          class="flex items-center gap-2 rounded-xl bg-white px-2 pb-2 pt-3"
        >

          <!-- =================================================
               IMAGE
          ================================================== -->

          <div
            class="size-16 shrink-0 overflow-hidden rounded-xl"
          >
            @if (selection()!.image) {
            <img
              [src]="selection()!.image"
              [alt]="selection()!.titre"
              class="size-full object-cover"
            />
            } @else {
            <div class="size-full bg-stone-200"></div>
            }
          </div>


          <!-- =================================================
               INFORMATIONS
          ================================================== -->

          <div class="min-w-0 flex-1">

            <!-- Titre -->
            <div class="flex items-center gap-1">

              <!-- Icône localisation -->
              <svg
                class="size-3 shrink-0 text-red-600"
                viewBox="0 0 16 16"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M8 1.5a4 4 0 0 0-4 4c0 2.8 4 7 4 7s4-4.2 4-7a4 4 0 0 0-4-4Z"
                  stroke="currentColor"
                  stroke-width="1"
                />
              </svg>

              <h3
                class="truncate text-xs font-semibold leading-4 text-zinc-950"
              >
                {{ selection()!.titre }}
              </h3>

            </div>


            <!-- Localisation / date -->
            <p
              class="truncate text-xs font-normal leading-4 text-zinc-500"
            >
              {{ selection()!.adresse }}{{ selection()!.distance ? ' · ' + selection()!.distance : '' }}
            </p>


            <!-- Statut -->
            <div class="flex items-center gap-1 pt-0.5">

              <span
                class="size-1.5 shrink-0 rounded-full bg-red-600"
              ></span>

              <span
                class="text-xs font-medium leading-4 text-red-600"
              >
                {{ libellePriorite() }}
              </span>

            </div>

          </div>


          <!-- =================================================
               BOUTON DÉTAIL
          ================================================== -->

          <button
            (click)="ouvrirSelection()"
            type="button"
            class="flex h-8 shrink-0 items-center gap-2 rounded-full bg-teal-950 px-3 py-2 shadow-[0_1px_2px_rgba(0,0,0,0.05)]"
          >

            <span
              class="text-xs font-medium leading-4 text-green-50"
            >
              Détail
            </span>

            <!-- Chevron -->
            <svg
              class="size-3 text-green-50"
              viewBox="0 0 12 12"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M4.5 3 7.5 6l-3 3"
                stroke="currentColor"
                stroke-width="1"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

          </button>

        </article>

      </div>

    </footer>
    }

  </section>

</div>
