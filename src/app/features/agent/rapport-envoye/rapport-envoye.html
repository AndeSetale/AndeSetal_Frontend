<div class="min-h-screen w-full bg-white font-sans text-zinc-950">

    <!-- ================================================== -->
    <!-- HEADER -->
    <!-- ================================================== -->

    <header class="flex h-16 w-full items-center justify-between px-4">

        <!-- Fermer -->
        <button type="button" (click)="fermer()" aria-label="Fermer"
            class="flex size-10 items-center justify-center rounded-full text-zinc-950 hover:bg-zinc-50">
            <svg lucideX class="size-5"></svg>
        </button>

        <!-- Espace pour conserver l'équilibre du header -->
        <div class="size-10"></div>

    </header>


    <!-- ================================================== -->
    <!-- CONTENU -->
    <!-- ================================================== -->

    <main class="flex w-full flex-col px-4 pb-8">


        <!-- ================================================== -->
        <!-- ICÔNE DE SUCCÈS -->
        <!-- ================================================== -->

        <section class="flex w-full justify-center pt-5">

            <div class="relative flex size-32 items-center justify-center">

                <!-- Cercle extérieur -->
                <div class="absolute inset-0 rounded-full border-2 border-teal-950/20"></div>

                <!-- Cercle intérieur -->
                <div class="absolute inset-2 rounded-full border-2 border-teal-950/30"></div>

                <!-- Cercle principal -->
                <div
                    class="relative flex size-20 items-center justify-center rounded-full bg-teal-950 shadow-[0_8px_24px_rgba(26,107,60,0.35)]">

                    <svg lucideCheck class="size-10 text-green-50" stroke-width="3"></svg>

                </div>

            </div>

        </section>


        <!-- ================================================== -->
        <!-- MESSAGE DE SUCCÈS -->
        <!-- ================================================== -->

        <section class="flex w-full justify-center px-2 pb-6 pt-5">

            <h1 class="text-center text-xl font-bold leading-7 text-teal-950">
                Rapport envoyé avec succès !
            </h1>

        </section>


        @if (rapportEnvoye(); as rapport) {

        <!-- ================================================== -->
        <!-- CARTE DU RAPPORT -->
        <!-- ================================================== -->

        <section class="w-full rounded-xl border border-zinc-200 bg-white p-4 shadow-sm">

            <!-- ================================================ -->
            <!-- TITRE + ID -->
            <!-- ================================================ -->

            <div class="flex flex-col gap-1">

                <h2 class="text-base font-semibold leading-6 text-zinc-950">
                    {{ rapport.titre }}
                </h2>

            </div>


            <!-- ================================================ -->
            <!-- STATUT -->
            <!-- ================================================ -->

            <div class="mt-2">

                <span
                    class="inline-flex items-center gap-1.5 rounded-md bg-teal-950 px-2 py-0.5 text-xs font-medium leading-4 text-green-500">

                    <svg lucideCircleCheck class="size-3"></svg>

                    Résolu

                </span>

            </div>


            <!-- ================================================ -->
            <!-- DÉTAILS DU RAPPORT -->
            <!-- ================================================ -->

            <div class="mt-3 flex flex-col gap-2 border-t border-zinc-200 pt-3">

                <!-- Adresse -->
                <div class="flex items-center gap-2">

                    <svg lucideMapPin class="size-4 shrink-0 text-teal-950"></svg>

                    <span class="min-w-0 truncate text-sm leading-5 text-zinc-950">
                        {{ rapport.adresse }}
                    </span>

                </div>


                <!-- Date -->
                <div class="flex items-center gap-2">

                    <svg lucideClock3 class="size-4 shrink-0 text-teal-950"></svg>

                    <span class="text-sm leading-5 text-zinc-950">
                        {{ dateEnvoi() }}
                    </span>

                </div>

            </div>

        </section>


        <!-- ================================================== -->
        <!-- NUMÉRO DE SUIVI -->
        <!-- ================================================== -->

        <section class="mt-3 w-full rounded-xl border border-zinc-200 bg-white p-4 shadow-sm">

            <!-- Label -->
            <p class="text-xs leading-4 text-zinc-500">
                Numéro de suivi
            </p>


            <!-- Numéro + copier -->
            <div class="mt-1 flex items-center justify-between gap-3">

                <p class="min-w-0 truncate text-lg font-bold leading-7 tracking-wide text-zinc-950">
                    {{ numeroSuivi() }}
                </p>


                <!-- Copier -->
                <button type="button" (click)="copierNumeroSuivi()" aria-label="Copier le numéro de suivi"
                    class="flex size-9 shrink-0 items-center justify-center rounded-lg text-teal-950 hover:bg-zinc-50">

                    <svg lucideCopy class="size-4"></svg>

                </button>

            </div>

        </section>


        <!-- ================================================== -->
        <!-- ACTION -->
        <!-- ================================================== -->

        <section class="w-full pt-6">

            <button type="button" (click)="retourAccueil()"
                class="flex h-12 w-full items-center justify-center gap-2 rounded-lg bg-teal-950 px-3 text-sm font-medium text-white shadow-sm hover:bg-teal-900">

                <svg lucideHouse class="size-4"></svg>

                Retour à l'accueil

            </button>

        </section>

        } @else {

        <!-- ================================================== -->
        <!-- RAPPORT INTROUVABLE -->
        <!-- ================================================== -->

        <section class="flex w-full flex-col items-center justify-center py-12 text-center">

            <h2 class="text-base font-semibold text-zinc-950">
                Rapport introuvable
            </h2>

            <p class="mt-1 text-sm text-zinc-500">
                Impossible de récupérer les informations du rapport.
            </p>

        </section>

        }

    </main>

</div>
