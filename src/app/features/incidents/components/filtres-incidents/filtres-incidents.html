  <!-- Header -->
  <div class="flex items-center justify-between mb-4">
    <h3 class="text-sm font-semibold text-teal-950">
      Filtres
    </h3>

    </span>
  </div>


 

  <!-- URGENCE -->
  <div class="mb-4">

    <p class="text-xs font-medium text-gray-500 mb-2">
      Urgence
    </p>

    <div class="flex flex-wrap gap-2">

      <button
        type="button"
        (click)="urgence = 'toutes'"
        [class.bg-gray-100]="urgence === 'toutes'"
        [class.border-teal-950]="urgence === 'toutes'"
        class="px-2.5 py-1 bg-white rounded-full border border-gray-200 text-xs text-gray-600"
      >
        Toutes
      </button>

      <button
        type="button"
        (click)="urgence = 'critique'"
        [class.bg-gray-100]="urgence === 'critique'"
        [class.border-teal-950]="urgence === 'critique'"
        class="px-2.5 py-1 bg-white rounded-full border border-gray-200 text-xs text-gray-600"
      >
        Critique
      </button>

      <button
        type="button"
        (click)="urgence = 'modere'"
        [class.bg-gray-100]="urgence === 'modere'"
        [class.border-teal-950]="urgence === 'modere'"
        class="px-2.5 py-1 bg-white rounded-full border border-gray-200 text-xs text-gray-600"
      >
        Modérée
      </button>

      <button
        type="button"
        (click)="urgence = 'leger'"
        [class.bg-gray-100]="urgence === 'leger'"
        [class.border-teal-950]="urgence === 'leger'"
        class="px-2.5 py-1 bg-white rounded-full border border-gray-200 text-xs text-gray-600"
      >
        Légère
      </button>

    </div>
  </div>
   <!-- TYPE D'INCIDENT -->
  <div class="mb-4">

    <p class="text-xs font-medium text-gray-500 mb-2">
      Type d'incident
    </p>

    <div class="flex flex-wrap gap-2">

      <button
        type="button"
        (click)="type = 'tous'"
        [class.bg-gray-100]="type === 'tous'"
        [class.border-teal-950]="type === 'tous'"
        class="px-2.5 py-1 bg-white rounded-full border border-gray-200 text-xs text-gray-600"
      >
        Tous
      </button>

      <button
        type="button"
        (click)="type = 'depot_sauvage'"
        [class.bg-gray-100]="type === 'depot_sauvage'"
        [class.border-teal-950]="type === 'depot_sauvage'"
        class="px-2.5 py-1 bg-white rounded-full border border-gray-200 text-xs text-gray-600"
      >
        Dépôt sauvage
      </button>

      <button
        type="button"
        (click)="type = 'dechets_plastiques'"
        [class.bg-gray-100]="type === 'dechets_plastiques'"
        [class.border-teal-950]="type === 'dechets_plastiques'"
        class="px-2.5 py-1 bg-white rounded-full border border-gray-200 text-xs text-gray-600"
      >
        Plastiques
      </button>

      <button
        type="button"
        (click)="type = 'egouts_bouches'"
        [class.bg-gray-100]="type === 'egouts_bouches'"
        [class.border-teal-950]="type === 'egouts_bouches'"
        class="px-2.5 py-1 bg-white rounded-full border border-gray-200 text-xs text-gray-600"
      >
        Égouts
      </button>

    </div>
  </div>



  <!-- STATUT -->
  <div class="mb-4">

    <p class="text-xs font-medium text-gray-500 mb-2">
      Statut
    </p>

    <div class="flex flex-wrap gap-2">

      <button
        type="button"
        (click)="statut = 'tous'"
        [class.bg-gray-100]="statut === 'tous'"
        [class.border-teal-950]="statut === 'tous'"
        class="px-2.5 py-1 bg-white rounded-full border border-gray-200 text-xs text-gray-600"
      >
        Tous
      </button>

      <button
        type="button"
        (click)="statut = 'nouveau'"
        [class.bg-gray-100]="statut === 'nouveau'"
        [class.border-teal-950]="statut === 'nouveau'"
        class="px-2.5 py-1 bg-white rounded-full border border-gray-200 text-xs text-gray-600"
      >
        Nouveau
      </button>

      <button
        type="button"
        (click)="statut = 'en_cours'"
        [class.bg-gray-100]="statut === 'en_cours'"
        [class.border-teal-950]="statut === 'en_cours'"
        class="px-2.5 py-1 bg-white rounded-full border border-gray-200 text-xs text-gray-600"
      >
        En cours
      </button>

      <button
        type="button"
        (click)="statut = 'resolu'"
        [class.bg-gray-100]="statut === 'resolu'"
        [class.border-teal-950]="statut === 'resolu'"
        class="px-2.5 py-1 bg-white rounded-full border border-gray-200 text-xs text-gray-600"
      >
        Résolu
      </button>

    </div>
  </div>


  <!-- BOUTON -->
  <button
    type="button"
    (click)="appliquerFiltres()"
    class="w-full py-2.5 bg-teal-950 text-white rounded-[10px] text-sm font-medium"
  >
    Appliquer les filtres
  </button>

</div>
