<div class="bg-white rounded-2xl border border-gray-200 overflow-hidden">

  <!-- Header -->
  <div class="p-6 border-b border-gray-200">
    <h2 class="text-lg font-bold text-gray-900 leading-7">
      Activité Récente
    </h2>

    <p class="text-sm text-gray-600 leading-5 mt-1">
      Derniers incidents traités par cet agent
    </p>
  </div>

  <!-- Table -->
  <div class="overflow-x-auto">
    <table class="w-full min-w-[1000px]">

      <!-- Header -->
      <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-bold text-gray-700 uppercase tracking-wide">
            ID
          </th>

          <th class="px-6 py-3 text-left text-xs font-bold text-gray-700 uppercase tracking-wide">
            Type
          </th>

          <th class="px-6 py-3 text-left text-xs font-bold text-gray-700 uppercase tracking-wide">
            Quartier
          </th>

          <th class="px-6 py-3 text-left text-xs font-bold text-gray-700 uppercase tracking-wide">
            Date de résolution
          </th>

          <th class="px-6 py-3 text-left text-xs font-bold text-gray-700 uppercase tracking-wide">
            Statut
          </th>

          <th class="px-6 py-3 text-right text-xs font-bold text-gray-700 uppercase tracking-wide">
            Actions
          </th>
        </tr>
      </thead>

      <!-- Body -->
      <tbody>
  @for (activity of activities; track activity.id) {
    <tr class="border-b border-gray-200">

      <td class="px-6 py-5 text-base font-semibold text-gray-900">
        {{ activity.id }}
      </td>

      <td class="px-6 py-5 text-sm text-gray-700">
        {{ activity.type }}
      </td>

      <td class="px-6 py-5 text-sm text-gray-700">
        {{ activity.quartier }}
      </td>

      <td class="px-6 py-5 text-sm text-gray-700">
        {{ activity.date }}
      </td>

      <td class="px-6 py-5">
        <span
          class="px-3 py-1 rounded-full text-xs font-semibold"
          [class.bg-green-100]="activity.statut === 'Validé'"
          [class.text-green-700]="activity.statut === 'Validé'"
          [class.border-green-200]="activity.statut === 'Validé'"
          [class.bg-blue-100]="activity.statut === 'Résolu'"
          [class.text-blue-700]="activity.statut === 'Résolu'"
          [class.border-blue-200]="activity.statut === 'Résolu'"
          [class.bg-orange-100]="activity.statut === 'En attente'"
          [class.text-orange-700]="activity.statut === 'En attente'"
          [class.border-orange-200]="activity.statut === 'En attente'"
          [class.border]="true"
        >
          {{ activity.statut }}
        </span>
      </td>

      <td class="px-6 py-5 text-right">
        <button
          class="px-3 py-1.5 rounded-[10px] text-sm font-semibold text-gray-800 hover:bg-gray-100"
        >
          Voir la preuve
        </button>
      </td>

    </tr>
  }
</tbody>
    </table>
  </div>

</div>
