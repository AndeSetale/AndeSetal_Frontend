<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 w-full">

  <app-stat-card
    title="Incidents résolus"
    [value]="agent().taches_resolues_semaine.toString()"
    description="Cette semaine"
    icon="check-circle"
    iconBg="bg-gray-800/10"
    iconColor="text-gray-800"
    badgeClass="bg-green-50 text-green-600"
    valueColor="text-gray-900"
  />

  <app-stat-card
    title="Taux de complétion"
    [value]="agent().taux_completion + '%'"
    description="Missions réalisées"
    icon="target"
    iconBg="bg-blue-100"
    iconColor="text-blue-600"
    badgeClass="bg-green-50 text-green-600"
    valueColor="text-gray-900"
  />

  <app-stat-card
    title="Ponctualité"
    [value]="agent().ponctualite + '%'"
    description="Performance"
    icon="clock"
    iconBg="bg-green-100"
    iconColor="text-green-600"
    badgeClass="text-gray-500"
    valueColor="text-green-600"
  />

</div>
