<header class="w-full px-6 py-7 flex justify-between items-center">

    <!-- Bouton retour -->
    <button type="button" class="w-10 h-10 bg-zinc-100 rounded-full flex items-center justify-center"
        aria-label="Retour" (click)="retourner()">
        <svg class="w-5 h-5" viewBox="0 0 20 20" fill="none">
            <path d="M8.33 4.17L4.17 10l4.16 5.83M4.17 10H16" stroke="currentColor" stroke-width="1.67"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </button>


    <!-- Logo -->
    <div class="w-36 h-8 flex items-center justify-center">
        <img src="./images/logo.png" alt="Logo Andë Sétal" class="w-full h-full object-contain" />
    </div>

    <!-- Espace pour équilibrer -->
    <div class="w-10 h-10"></div>

</header>

<!-- Navigation -->
<nav class="w-full border-b border-zinc-200 flex">

    <!-- Connexion -->
    <button type="button" class="flex-1 py-3.5 relative text-sm font-bold" [class.text-zinc-950]="estSurConnexion()"
        [class.text-zinc-500]="!estSurConnexion()" (click)="allerVersConnexion()">
        Se connecter

        @if (estSurConnexion()) {
        <span class="absolute bottom-0 left-0 w-full h-0.5
               bg-teal-950 rounded-full"></span>
        }
    </button>


    <!-- Inscription -->
    <button type="button" class="flex-1 py-3 relative text-sm font-medium" [class.text-zinc-950]="estSurInscription()"
        [class.text-zinc-500]="!estSurInscription()" (click)="allerVersInscription()">
        Créer un compte

        @if (estSurInscription()) {
        <span class="absolute bottom-0 left-0 w-full h-0.5
               bg-teal-950 rounded-full"></span>
        }
    </button>

</nav>
