<div
  class="bg-white border border-gray-200 rounded-2xl p-4
         shadow-sm hover:shadow-md transition-shadow duration-200"
>

  <!-- Header -->
  <div class="flex items-center justify-between">

    <p class="text-sm font-normal text-teal-950">
      Répartition par type
    </p>

    <button
      type="button"
      class="w-8 h-8 flex items-center justify-center
             rounded-lg text-gray-500 hover:bg-gray-100"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
      >
        <circle cx="8" cy="3" r="0.8" fill="currentColor" />
        <circle cx="8" cy="8" r="0.8" fill="currentColor" />
        <circle cx="8" cy="13" r="0.8" fill="currentColor" />
      </svg>
    </button>

  </div>

  <!-- Donut -->
  <div class="h-36 flex justify-center items-center">

    <div
      class="donut"
      [style.background]="donutStyle().background"
    >

      <!-- Centre -->
      <div class="donut-center">
        {{ totalIncidents() }}
      </div>

    </div>

  </div>

  <!-- Légende -->
  <div class="pt-1 flex flex-col gap-2">

    @for (type of incidentTypes(); track type.label) {

      <div class="flex justify-between items-center">

        <div class="flex items-center gap-2">

          <span
            class="w-2.5 h-2.5 rounded-full"
            [style.background-color]="type.color"
          ></span>

          <span class="text-xs text-gray-700">
            {{ type.label }}
          </span>

        </div>

        <span class="text-xs text-teal-950">
          {{ type.value }} %
        </span>

      </div>

    }

  </div>

</div>
