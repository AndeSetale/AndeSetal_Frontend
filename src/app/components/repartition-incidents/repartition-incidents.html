<div
  class="bg-white border border-gray-200 rounded-2xl p-4
         shadow-sm hover:shadow-md transition-shadow duration-200"
>

  <!-- Header -->
  <div class="self-stretch flex flex-col justify-start items-start">
  <div class="text-gray-900 text-lg font-bold  leading-7">
    {{ title() }}
  </div>
</div>

<div class="self-stretch flex flex-col justify-start items-start">
  <div class="text-gray-600 text-sm font-normal  leading-5">
    {{ subtitle() }}
  </div>
</div>

  <!-- Donut -->
  <div class="h-36 flex justify-center items-center">

    <div
      class="donut"
      [style.background]="donutBackground"
    >

      <!-- Centre -->
      <div class="donut-center">
        {{ totalIncidents() }}
      </div>

    </div>

  </div>

  <!-- Légende -->
  <div class="pt-1 flex flex-col gap-2">

    @for (type of incidentTypes(); track type.label) {

      <div class="flex justify-between items-center">

        <div class="flex items-center gap-2">

          <span
            class="w-2.5 h-2.5 rounded-full"
            [style.background-color]="type.color"
          ></span>

          <span class="text-xs text-gray-700">
            {{ type.label }}
          </span>

        </div>

        <span class="text-xs text-teal-950">
          {{ type.value }} %
        </span>

      </div>

    }

  </div>

</div>
