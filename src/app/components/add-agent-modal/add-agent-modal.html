<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 p-4">
  <div
  class="w-full max-w-md max-h-[90vh] bg-white rounded-2xl shadow-2xl overflow-hidden"
>
    <!-- Header -->
    <div class="p-6 border-b border-gray-200 flex items-start justify-between">
      <div>
        <h2 class="text-xl font-bold text-slate-900">
          Ajouter un nouvel agent
        </h2>

        <p class="mt-1 text-sm text-slate-500">
          Inviter un nouvel agent dans le système
        </p>
      </div>

      <button
  type="button"
  (click)="onClose()"
  class="p-2 rounded-lg hover:bg-gray-100"
>
  ✕
</button>
    </div>

    <!-- Formulaire -->
  <form class="p-6 space-y-5 max-h-[calc(90vh-100px)] overflow-y-auto custom-scrollbar">

      <!-- Nom -->
      <div>
        <label class="block mb-2 text-sm font-semibold text-gray-700">
          Nom complet
        </label>

        <input
          type="text"
          placeholder="Saisir le nom complet de l'agent"
          class="w-full h-11 px-4 rounded-[10px] border border-gray-300
                 text-sm outline-none focus:border-teal-700"
        />
      </div>

      <!-- Email -->
      <div>
        <label class="block mb-2 text-sm font-semibold text-gray-700">
          Adresse e-mail
        </label>

        <input
          type="email"
          placeholder="agent@plateau.sn"
          class="w-full h-11 px-4 rounded-[10px] border border-gray-300
                 text-sm outline-none focus:border-teal-700"
        />
      </div>

      <!-- Mot de passe -->
      <div>
        <label class="block mb-2 text-sm font-semibold text-gray-700">
          Mot de passe
        </label>

        <input
          type="password"
          placeholder="************"
          class="w-full h-11 px-4 rounded-[10px] border border-gray-300
                 text-sm outline-none focus:border-teal-700"
        />
      </div>

      <!-- Téléphone -->
      <div>
        <label class="block mb-2 text-sm font-semibold text-gray-700">
          Numéro de téléphone
        </label>

        <input
          type="tel"
          placeholder="+221 77 123 45 67"
          class="w-full h-11 px-4 rounded-[10px] border border-gray-300
                 text-sm outline-none focus:border-teal-700"
        />
      </div>

      <!-- Département -->
      <div>
        <label class="block mb-2 text-sm font-semibold text-gray-700">
          Département
        </label>

        <select
          class="w-full h-11 px-4 rounded-[10px] border border-gray-300
                 bg-white text-sm text-gray-500 outline-none
                 focus:border-teal-700"
        >
          <option value="">Sélectionner le service</option>
          <option value="voirie">Voirie</option>
          <option value="eclairage">Éclairage public</option>
          <option value="dechets">Déchets</option>
          <option value="eau">Eau</option>
        </select>
      </div>

      <!-- Rôle -->
      <div>
        <label class="block mb-2 text-sm font-semibold text-gray-700">
          Sélection du rôle
        </label>

        <select
          class="w-full h-11 px-4 rounded-[10px] border border-gray-300
                 bg-white text-sm text-gray-500 outline-none
                 focus:border-teal-700"
        >
          <option value="">Sélectionner le rôle</option>
          <option value="agent">Agent</option>
          <option value="admin">Administrateur</option>
        </select>
      </div>

      <!-- Actions -->
      <div class="flex gap-3 pt-2">
       <button
  type="button"
  (click)="onClose()"
  class="flex-1 h-11 rounded-[10px] border-2 border-gray-300
         text-sm font-semibold text-gray-700 hover:bg-gray-50"
>
  Annuler
</button>

        <button
          type="submit"
          class="flex-1 h-11 rounded-[10px] bg-gray-800
                 text-white text-sm font-semibold hover:bg-gray-700"
        >
          Inscrire
        </button>
      </div>

    </form>
  </div>
</div>
