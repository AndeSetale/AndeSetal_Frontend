<div class="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm">

  <div class="overflow-x-auto">

    <table class="w-full text-left">

      <thead class="border-b border-gray-200">
        <tr class="text-xs text-gray-500 font-normal">

          <th class="px-4 py-3 font-normal">
            IDENTIFIANT
          </th>

          <th class="px-4 py-3 font-normal">
            TYPE
          </th>

          <th class="px-4 py-3 font-normal">
            QUARTIER
          </th>

          <th class="px-4 py-3 font-normal">
            URGENCE
          </th>

          <th class="px-4 py-3 font-normal">
            STATUT
          </th>

        </tr>
      </thead>

      <tbody>

        @for (incident of incidents(); track incident.id) {

          <tr class="border-b border-gray-100 last:border-0">

            <td class="px-4 py-4 text-xs text-teal-900">
              {{ incident.id }}
            </td>

            <td class="px-4 py-4 text-xs text-teal-900">
              {{ incident.type }}
            </td>

            <td class="px-4 py-4 text-xs text-teal-900">
              {{ incident.quartier }}
            </td>

            <td class="px-4 py-4">

              <span
                class="px-2 py-0.5 rounded-sm text-xs"
                [class.bg-gray-100]="incident.urgence !== 'CRITIQUE'"
                [class.bg-red-50]="incident.urgence === 'CRITIQUE'"
                [class.text-red-600]="incident.urgence === 'CRITIQUE'"
                [class.text-orange-500]="incident.urgence === 'MODÉRÉ'"
                [class.text-green-600]="incident.urgence === 'LÉGER'"
              >
                {{ incident.urgence }}
              </span>

            </td>

            <td class="px-4 py-4 text-xs text-gray-700">
              {{ incident.statut }}
            </td>

          </tr>

        }

      </tbody>

    </table>

  </div>

</div>
